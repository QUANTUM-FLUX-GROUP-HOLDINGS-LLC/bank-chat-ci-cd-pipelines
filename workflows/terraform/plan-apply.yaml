name: Terraform Plan & Apply
on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      environment:
        required: true
        type: string
        default: 'dev'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      has-changes: $\{\{ steps.plan.outputs.has_changes $\}}
    steps:
- name: Checkout
  uses: actions/checkout@v4

- name: Setup Terraform
  uses: hashicorp/setup-terraform@v3
  with:
    terraform_version: 1.7.0

- name: Terraform Init
  run: terraform init

- name: Terraform Plan
  id: plan
  run: |
    terraform plan -out=tfplan
    echo "has_changes=$$(terraform plan -no-color | grep -q 'No changes.')"
    if [ "$$?" -ne 0 ]; then
      echo "has_changes=true" >> $GITHUB_OUTPUT
    fi

- name: Upload Plan Artifact
  uses: actions/upload-artifact@v4
  with:
    name: tfplan
    path: tfplan

  security-scan:
    runs-on: ubuntu-latest
    needs: plan
    steps:
- name: Checkout
  uses: actions/checkout@v4

- name: Run Checkov
  uses: bridgecrewio/checkov-action@v12
  with:
    framework: terraform
    output_format: sarif
    output_file_path: checkov_results.sarif

- name: Upload Checkov Results
  uses: github/codeql-action/upload-sarif@v3
  if: always()
  with:
    sarif_file: checkov_results.sarif

  apply:
    runs-on: ubuntu-latest
    needs: [plan, security-scan]
    if: github.event_name == 'push'
    environment: ${{ inputs.environment }}
    steps:
- name: Download Plan Artifact
  uses: actions/download-artifact@v4
  with:
    name: tfplan

- name: Setup Terraform
  uses: hashicorp/setup-terraform@v3
  with:
    terraform_version: 1.7.0

- name: Terraform Apply
  run: |
    echo "Applying changes for ${{ inputs.service-name }}"
    echo "Environment: ${{ inputs.environment }}"
